name: Rescue Build Universal APK
on:
  workflow_dispatch:
  push:
    branches: [ "**" ]
jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Standardize Gradle Wrapper
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.2-bin.zip|' gradle/wrapper/gradle-wrapper.properties || true

      - name: Compile APK (Clean No-Daemon)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-rescue-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
